# Pages CMS (https://app.pagescms.org): the admin page for this site.
# Every save is a commit to this repo; .github/workflows/deploy.yml then rebuilds the sandbox copy of the site
# (/sandbox/). The live site only changes when someone approves (actions below).
#
# Every kind of download has a folder per Products menu category and, inside it, one per product (IES files go one level
# deeper, in a folder named after the part number). The site finds a file by its name in any folder, so a file can be
# moved without breaking a link. Documents keep their exact names (rename: false). To post a newer version, upload it under the same name with
# V2, rev3 or a date added (RP-LBI-Spec_Sheet V2.pdf, LBI-G2-Spec-Sheet-2026-10-12.pdf): the build points every
# link at the newest version. The older file can stay or be deleted.

# "Approve and publish to live" (under Actions in the admin page): everything on the sandbox goes live, in the name of
# whoever clicks it. The portal at /admin/ lists every change, who made it, when, and each approval.
actions:
  - name: publish
    label: Approve and publish to live
    workflow: approve.yml
    ref: main
    cancelable: false
    confirm:
      title: Publish everything now on the sandbox to the live site?
      button: Approve and publish
    fields:
      - name: note
        label: Note (optional, shown in the history)
        type: text
  - name: roll-back
    label: Roll back the live site
    workflow: roll-back.yml
    ref: main
    cancelable: false
    confirm:
      title: Put the live site back to the version that was live before this one?
      button: Roll back
    fields:
      - name: note
        label: Why (optional, shown in the history)
        type: text
  - name: schedule
    label: Schedule a go-live
    workflow: schedule.yml
    ref: main
    cancelable: false
    confirm:
      title: Approve everything now on the sandbox and publish it at this date and time (Central)?
      button: Schedule
    fields:
      - name: when
        label: Date and time, Central (for example 2026-10-20 9:00 am)
        type: text
        required: true
      - name: note
        label: Note (optional, shown in the history)
        type: text
  - name: schedule-cancel
    label: Cancel the scheduled go-live
    workflow: schedule-cancel.yml
    ref: main
    cancelable: false
    confirm:
      title: Cancel the scheduled go-live? The sandbox keeps its changes.
      button: Cancel the go-live
  - name: undo
    label: Undo a change
    workflow: undo.yml
    ref: main
    cancelable: false
    confirm:
      title: Reverse this one change on the sandbox? It will wait for approval like any other change.
      button: Undo
    fields:
      - name: change
        label: Change id (shown next to the change on the admin page)
        type: text
        required: true

content:
  - name: pages
    label: Product pages
    description: The text and part-number tables of each product page, in one folder per Products menu category. Photos, downloads and layout are set elsewhere.
    type: collection
    path: content/pages
    filename: "{primary}.json"   # without this Pages CMS only lists .md files
    format: json
    operations:
      create: false
      rename: false
      delete: false
    view:
      primary: title
      fields: [title, headline]
      sort: [title]
      search: [title, headline, intro]
    fields:
      - name: title
        label: Page title
        type: text
        required: true
      - name: subtitle
        label: Subtitle
        type: string
      - name: headline
        label: Headline
        type: string
      - name: intro
        label: Introduction
        description: Bold, italic, links and lists are kept; fonts and colours follow the site.
        type: rich-text
      - name: callouts
        label: Key points
        description: Short lines shown near the top of the page.
        type: string
        list: true
      - name: sheet_points
        label: Spec-sheet points
        description: "Spec-sheet pages only (LBI G1, Shoe Box + Wall Pack, TAA troffers): the bullet points under the headline. These pages show them instead of the Introduction, Key points and At a glance."
        type: string
        list: true
      - name: sheet_marks
        label: "Spec-sheet pages: listing and warranty logos"
        description: Black logos on a transparent background (PNG); the site colours them.
        type: object
        list: true
        fields:
          - { name: logo, label: Logo, type: image, options: { media: photos } }
          - { name: alt, label: Description, type: string }
          - { name: height, label: Height in pixels, type: number }
      - name: sheet_flex
        label: "Spec-sheet pages: SuperFlex or FlexColor panel"
        type: object
        fields:
          - { name: logo, label: Logo, type: image, options: { media: photos } }
          - { name: alt, label: Logo description, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: note, label: Note, type: string }
          - { name: words, label: Show the FlexWatt and FlexColor words, type: boolean, hidden: true }
      - name: sheet_icons
        label: "Spec-sheet pages: icon row"
        description: Black icons on a transparent background (PNG); the site colours them.
        type: object
        list: true
        fields:
          - { name: icon, label: Icon, type: image, options: { media: photos } }
          - { name: value, label: Bold line (optional), type: string }
          - { name: caption, label: Caption, type: string }
          - { name: alt, label: Description, type: string }
          - { name: scale, label: Scale, type: number, hidden: true }
      - name: sheet_plug
        label: "Spec-sheet pages: sensor line"
        type: string
      - name: features
        label: At a glance
        description: One feature per item, with an optional note shown after it.
        type: object
        list: true
        fields:
          - name: label
            label: Feature
            type: string
          - name: note
            label: Note
            type: string
      - name: tables
        label: Part-number and spec tables
        type: object
        list: true
        fields:
          - name: title
            label: Table title
            type: string
          - name: leadIn
            label: Line above the table
            type: string
          - name: columns
            label: Column headings
            description: One heading per column, left to right.
            type: string
            list: true
          - name: rows
            label: Rows
            description: "One row per item: the cells in column order, separated by |. Wrap a value in **double asterisks** to mark it as the factory default. Leave a cell empty with nothing between two | marks."
            type: string
            list: true
          - name: notes
            label: Notes under the table
            type: string
            list: true
          - name: pdfPage
            label: Catalog PDF page
            type: number
            hidden: true
          - name: catalogPage
            label: Catalog page
            type: number
            hidden: true
          - name: source
            label: Source
            type: string
            hidden: true
      - name: footnotes
        label: Footnotes
        type: string
        list: true
      - name: photos
        label: Photos
        description: Every photo below the top of the page, in the order shown.
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image, options: { media: photos } }
          - { name: alt, label: Photo description, type: string }
          - { name: caption, label: Caption, type: string }
          - { name: show_as, label: Show as, type: select, options: { values: [ { value: slideshow, label: In the slideshow }, { value: cutout, label: Product cutout (on white) }, { value: diagram, label: Diagram }, { value: banner, label: Wide banner } ] } }
          - { name: fit, label: Fit, type: select, options: { values: [ { value: auto, label: Automatic }, { value: whole, label: Show the whole photo }, { value: fill, label: Fill the frame } ] } }
          - { name: size, label: Size (product cutouts), type: select, options: { values: [ { value: auto, label: Automatic }, { value: normal, label: Normal }, { value: wide, label: Wide } ] } }
          - { name: focus, label: Photo focus, description: "Optional, for example 50% 30%", type: string }
          - { name: zoom, label: Zoom (%), description: "100 shows the photo as framed, up to 300", type: number }
          - { name: photo_width, label: Width (% of the page), description: "Diagrams and wide banners, 20 to 100", type: number }
          - { name: photo_align, label: Alignment, type: select, options: { values: [ { value: left, label: Left }, { value: center, label: Centre }, { value: right, label: Right } ] } }
          - { name: kind, label: Kind, type: string, hidden: true }
      - name: install_photos
        label: Installation photos
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image, options: { media: photos } }
          - { name: alt, label: Photo description, type: string }
          - { name: caption, label: Caption, type: string }
          - { name: focus, label: Photo focus, type: string }
          - { name: zoom, label: Zoom (%), type: number }
      - name: sheet_slides
        label: "Spec-sheet pages: top slideshow"
        description: Product-only shots first, then photos in use.
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image, options: { media: photos } }
          - { name: alt, label: Photo description, type: string }
          - { name: caption, label: Caption, type: string }
          - { name: fit, label: Fit, type: select, options: { values: [ { value: whole, label: Show the whole photo }, { value: fill, label: Fill the frame } ] } }
          - { name: focus, label: Photo focus, type: string }
          - { name: zoom, label: Zoom (%), type: number }
      - name: hero_image
        label: Main photo
        description: Shown whole, never cropped. Spec-sheet pages show their spec-sheet photos at the top and use this one on cards and link previews.
        type: object
        fields:
          - name: src
            label: Photo
            type: image
            options:
              media: photos
          - name: alt
            label: Photo description
            description: What the photo shows, for screen readers and search engines.
            type: string
  # The home page (content/home/index.json) is a stack of blocks laid out in CloudCannon's visual editor; Pages CMS does not edit it.

media:
  - name: photos
    label: Photos
    input: assets/img/uploads
    output: /assets/img/uploads
    extensions: [jpg, jpeg, png, webp]
  - name: spec-sheets
    label: Spec sheets
    input: assets/docs/spec-sheets
    output: /assets/docs/spec-sheets
    rename: false
    extensions: [pdf]
  - name: instructions
    label: Installation instructions
    input: assets/docs/instructions
    output: /assets/docs/instructions
    rename: false
    extensions: [pdf]
  - name: ies
    label: IES files
    input: assets/ies
    output: /assets/ies
    rename: false
    extensions: [ies, zip, pdf, ldt]
  - name: sell-sheets
    label: Sell sheets and flyers
    input: assets/docs/sell-sheets
    output: /assets/docs/sell-sheets
    rename: false
    extensions: [pdf]
  - name: case-studies
    label: Case studies
    input: assets/docs/case-studies
    output: /assets/docs/case-studies
    rename: false
    extensions: [pdf]
  - name: catalog
    label: Catalog
    input: assets/docs/catalog
    output: /assets/docs/catalog
    rename: false
    extensions: [pdf]
  - name: documents
    label: All documents
    input: assets/docs
    output: /assets/docs
    rename: false
    extensions: [pdf]

settings:
  content:
    merge: true
  commit:
    identity: user
