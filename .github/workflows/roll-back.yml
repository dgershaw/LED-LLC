# "Roll back the live site", run from the admin page: puts the live site back to the version that was live
# before the current one, in the name of whoever clicked, and records it in the history. Nothing is deleted:
# the sandbox keeps every change, and approving again publishes it all.
name: Roll back the live site

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Who rolled back (sent by the admin page)
        required: false
        default: "{}"

permissions:
  contents: write
  actions: write

concurrency:
  group: live-branch
  cancel-in-progress: false

jobs:
  roll-back:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: Restore the previous live version
        env:
          PAYLOAD: ${{ inputs.payload }}
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(printf '%s' "$PAYLOAD" | jq -r '.triggeredBy.name // .triggeredBy.githubUsername // empty')
          EMAIL=$(printf '%s' "$PAYLOAD" | jq -r '.triggeredBy.email // empty')
          NOTE=$(printf '%s' "$PAYLOAD" | jq -r '.inputs.note // empty')
          [ -n "$NAME" ] || NAME="${GITHUB_ACTOR}"
          [ -n "$EMAIL" ] || EMAIL="${GITHUB_ACTOR}@users.noreply.github.com"
          export GIT_AUTHOR_NAME="$NAME" GIT_AUTHOR_EMAIL="$EMAIL"
          export GIT_COMMITTER_NAME="Site publisher" GIT_COMMITTER_EMAIL="noreply@led-llc.com"
          git fetch origin live:refs/remotes/origin/live || { echo "::error::Nothing has been published to the live site yet."; exit 1; }
          snapshot() { local s; s=$(git log -1 --format=%B "$1" | sed -n 's/^Snapshot: //p' | head -1); [ -n "$s" ] || s=$(git rev-parse -q --verify "$1^2" || true); echo "$s"; }
          CUR=$(snapshot origin/live)
          PREV=""; PREVSNAP=""
          for c in $(git rev-list --first-parent origin/live); do
            s=$(snapshot "$c")
            if [ -n "$s" ] && [ "$s" != "$CUR" ]; then PREV=$c; PREVSNAP=$s; break; fi
          done
          [ -n "$PREV" ] || { echo "::error::There is no earlier version to go back to."; exit 1; }
          MSG="Rolled back the live site by $NAME"$'\n\n'
          [ -z "$NOTE" ] || MSG="$MSG""Note: $NOTE"$'\n'
          MSG="$MSG""Restores: $PREV"$'\n'"Snapshot: $PREVSNAP"
          C=$(printf '%s\n' "$MSG" | git commit-tree "$PREVSNAP^{tree}" -p origin/live)
          git push origin "$C:refs/heads/live"
          gh workflow run deploy.yml --ref main
