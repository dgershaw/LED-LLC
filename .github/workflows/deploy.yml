# The site moved to Cloudflare Pages on 2026-11-17 (David): led-sandbox.pages.dev (the sandbox and the administration
# portal, from `main`) and led-live.pages.dev (the live site, from `live`), both built by tools/cloudflare-build.sh.
# This workflow no longer builds anything. It only keeps the old GitHub Pages addresses forwarding to the new ones.
name: Build and publish

on:
  push:
    branches: [main, live]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      LIVE: https://led-live.pages.dev/
      SANDBOX: https://led-sandbox.pages.dev/
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Write the pages that forward the old addresses
        run: |
          mkdir -p out/sandbox out/admin
          page() {  # page <file> <new address>
            printf '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex">\n<title>This page has moved</title>\n<meta http-equiv="refresh" content="0; url=%s">\n<link rel="canonical" href="%s"></head>\n<body><p>This page has moved to <a href="%s">%s</a>.</p></body></html>\n' "$2" "$2" "$2" "$2" > "$1"
          }
          page out/index.html "$LIVE"
          page out/sandbox/index.html "$SANDBOX"
          page out/admin/index.html "${SANDBOX}admin/"
          # any other old link: the same page on the new site
          cat > out/404.html <<HTML
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>This page has moved</title>
          <script>
          var p = location.pathname.replace(/^\/LED-LLC\//i, ""), to = "$LIVE" + p;
          if (p.indexOf("sandbox/") === 0) to = "$SANDBOX" + p.slice(8);
          else if (p.indexOf("admin/") === 0) to = "$SANDBOX" + p;
          location.replace(to + location.search + location.hash);
          </script></head>
          <body><p>This site has moved to <a href="$LIVE">$LIVE</a>.</p></body></html>
          HTML
          printf 'User-agent: *\nDisallow: /\n' > out/robots.txt
          touch out/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Let GitHub's own branch deploy finish first (until Settings > Pages > Source is GitHub Actions, it races this one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null)" = "workflow" ]; then
            echo "Pages is set to GitHub Actions; nothing to wait for."; exit 0
          fi
          for i in $(seq 1 24); do
            B=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '[.commit, .status]|@tsv' 2>/dev/null || true)
            echo "latest branch build: $B"
            case "$B" in "${GITHUB_SHA}"$'\t'built|"${GITHUB_SHA}"$'\t'errored) exit 0;; esac
            sleep 5
          done
          echo "The branch deploy did not finish in two minutes; publishing anyway."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
