# Builds and publishes both copies of the site after every change (David, 2026-10-13):
#   the sandbox, from the `main` branch, where every edit and upload lands first, at /sandbox/
#   the live site, from the `live` branch, which only moves when someone approves (approve.yml), at the root
# plus the administration portal at /admin/. Nothing built is committed: the pages go straight to GitHub Pages.
name: Build and publish

on:
  push:
    branches: [main, live]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the sandbox (main)
        uses: actions/checkout@v5
        with:
          path: main
          fetch-depth: 0
      - name: Check out the live version (live, or main until the first approval)
        run: |
          cd main
          git fetch origin live:refs/remotes/origin/live 2>/dev/null && LIVE=origin/live || LIVE=main
          echo "Live version: $LIVE"
          git worktree add --detach ../live "$LIVE"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install the build's libraries
        run: pip install jinja2==3.1.6 markupsafe==3.0.3 pillow==12.3.0
      - name: Build the live site
        run: |
          cd live && python3 tools/build.py
          mkdir -p ../out
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tools' --exclude 'data' --exclude 'content' --exclude 'notes' \
                --exclude 'README.md' --exclude '.pages.yml' --exclude '.gitignore' --exclude 'TEST_COPY' ./ ../out/
      - name: Build the sandbox
        run: |
          cd main && python3 tools/build.py
          mkdir -p ../out/sandbox
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tools' --exclude 'data' --exclude 'content' --exclude 'notes' \
                --exclude 'README.md' --exclude '.pages.yml' --exclude '.gitignore' --exclude 'TEST_COPY' ./ ../out/sandbox/
          printf 'User-agent: *\nDisallow: /\n' > ../out/sandbox/robots.txt
      - name: Build the administration portal
        run: python3 main/tools/portal.py --main main --live live --out out
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
