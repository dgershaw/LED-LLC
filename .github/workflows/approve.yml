# "Approve and publish to live", run from the admin page (Pages CMS passes who clicked it in `payload`).
# Moves the `live` branch to everything now on the sandbox with a merge commit in the approver's name, then
# starts the publish workflow. The portal reads these merge commits as the approval history.
name: Approve and publish to live

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Who approved (sent by the admin page)
        required: false
        default: "{}"

permissions:
  contents: write
  actions: write

concurrency:
  group: approve
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: Move the live version to the sandbox's content
        env:
          PAYLOAD: ${{ inputs.payload }}
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(printf '%s' "$PAYLOAD" | jq -r '.triggeredBy.name // .triggeredBy.githubUsername // empty')
          EMAIL=$(printf '%s' "$PAYLOAD" | jq -r '.triggeredBy.email // empty')
          NOTE=$(printf '%s' "$PAYLOAD" | jq -r '.inputs.note // empty')
          [ -n "$NAME" ] || NAME="${GITHUB_ACTOR}"
          [ -n "$EMAIL" ] || EMAIL="${GITHUB_ACTOR}@users.noreply.github.com"
          git config user.name "$NAME"
          git config user.email "$EMAIL"
          if git fetch origin live:refs/remotes/origin/live 2>/dev/null; then
            git checkout -B live origin/live
          else
            # the first approval: the live branch starts at the site's first commit, so this merge carries everything
            git checkout -B live "$(git rev-list --max-parents=0 origin/main | tail -1)"
          fi
          MSG="Approved for the live site by $NAME"
          if [ -n "$NOTE" ]; then MSG="$MSG"$'\n\n'"Note: $NOTE"; fi
          git merge --no-ff --no-edit -m "$MSG" origin/main
          git push origin live
          gh workflow run deploy.yml --ref main
