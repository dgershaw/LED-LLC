# "Approve and publish to live", run from the admin page (Pages CMS passes who clicked it in `payload`).
# Adds a commit to the `live` branch whose content is exactly what the sandbox (`main`) holds now, in the
# approver's name, then starts the publish workflow. The portal reads these commits as the approval history;
# each one carries a "Snapshot:" line naming the sandbox commit it published, which roll-back.yml relies on.
name: Approve and publish to live

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Who approved (sent by the admin page)
        required: false
        default: "{}"

permissions:
  contents: write
  actions: write

concurrency:
  group: live-branch
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: Publish the sandbox's content as the live version
        env:
          PAYLOAD: ${{ inputs.payload }}
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(printf '%s' "$PAYLOAD" | jq -r '.triggeredBy.name // .triggeredBy.githubUsername // empty')
          EMAIL=$(printf '%s' "$PAYLOAD" | jq -r '.triggeredBy.email // empty')
          NOTE=$(printf '%s' "$PAYLOAD" | jq -r '.inputs.note // empty')
          [ -n "$NAME" ] || NAME="${GITHUB_ACTOR}"
          [ -n "$EMAIL" ] || EMAIL="${GITHUB_ACTOR}@users.noreply.github.com"
          export GIT_AUTHOR_NAME="$NAME" GIT_AUTHOR_EMAIL="$EMAIL"
          export GIT_COMMITTER_NAME="Site publisher" GIT_COMMITTER_EMAIL="noreply@led-llc.com"
          SNAP=$(git rev-parse origin/main)
          PARENT=()
          if git fetch origin live:refs/remotes/origin/live 2>/dev/null; then
            PARENT=(-p origin/live)
            CUR=$(git log -1 --format=%B origin/live | sed -n 's/^Snapshot: //p' | head -1)
            [ -n "$CUR" ] || CUR=$(git rev-parse -q --verify origin/live^2 || true)
            if [ "$CUR" = "$SNAP" ]; then echo "The live site already matches the sandbox; nothing to publish."; exit 0; fi
          fi
          MSG="Approved for the live site by $NAME"$'\n\n'
          [ -z "$NOTE" ] || MSG="$MSG""Note: $NOTE"$'\n'
          MSG="$MSG""Snapshot: $SNAP"
          C=$(printf '%s\n' "$MSG" | git commit-tree "$SNAP^{tree}" "${PARENT[@]}")
          git push origin "$C:refs/heads/live"
          gh workflow run deploy.yml --ref main
