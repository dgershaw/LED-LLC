# "Approve and publish to live", run from the admin page (Pages CMS passes who clicked it in `payload`).
# Publishes the sandbox (`main`) as the live version in the approver's name (tools/publish-live.sh), starts the
# publish workflow and tells the team. The portal reads the live branch's commits as the approval history.
name: Approve and publish to live

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Who approved (sent by the admin page)
        required: false
        default: "{}"

permissions:
  contents: write
  actions: write

concurrency:
  group: live-branch
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: Publish the sandbox's content as the live version
        env:
          PAYLOAD: ${{ inputs.payload }}
          GH_TOKEN: ${{ github.token }}
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        run: |
          NAME=$(printf '%s' "$PAYLOAD" | jq -r '.triggeredBy.name // .triggeredBy.githubUsername // empty')
          EMAIL=$(printf '%s' "$PAYLOAD" | jq -r '.triggeredBy.email // empty')
          NOTE=$(printf '%s' "$PAYLOAD" | jq -r '.inputs.note // empty')
          [ -n "$NAME" ] || NAME="${GITHUB_ACTOR}"
          [ -n "$EMAIL" ] || EMAIL="${GITHUB_ACTOR}@users.noreply.github.com"
          OUT=$(bash tools/publish-live.sh "$NAME" "$EMAIL" "$NOTE")
          echo "$OUT"
          case "$OUT" in Published*)
            gh workflow run deploy.yml --ref main
            bash tools/notify.sh "Live site updated" "$NAME approved the sandbox for the live site.${NOTE:+ Note: $NOTE} It is live in a few minutes." "https://dgershaw.github.io/LED-LLC/admin/" "Open the admin portal";;
          esac
