# Rebuilds the pages after every push (an edit or upload on the admin page, or a change pushed by Claude)
# and publishes the result on GitHub Pages.
name: Build the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the build's libraries
        run: pip install jinja2==3.1.6 markupsafe==3.0.3 pillow==12.3.0
      - name: Build the pages
        run: python3 tools/build.py
      - name: Commit the rebuilt pages
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "The pages were already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild the pages after ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "GitHub Pages will publish on its own."
